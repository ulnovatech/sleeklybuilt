# Discovery Intelligence — Postgres + Next.js + job worker
# Use with sleeklybuilt core:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.discovery.yml up -d --build
# Or: npm run docker:discovery
#
# Build context (C0):
#   Source of truth is the sibling Lead Discover tree:
#     htdocs/lead discover - sleekly
#   Default below builds that tree from infra/ (../../lead discover - sleekly).
#   Locally, sleeklybuilt/discovery is a junction to the same tree so
#   `pnpm --prefix discovery` and GCE-style `DISCOVERY_BUILD_CONTEXT=../discovery` still work.
#   On the VM after rsync into repo/discovery, set:
#     DISCOVERY_BUILD_CONTEXT=../discovery

name: infra

x-discovery-build: &discovery-build
  context: ${DISCOVERY_BUILD_CONTEXT:-../../lead discover - sleekly}
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${DISCOVERY_ENV_FILE:-./env/docker.discovery.env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - sleeklybuilt

  discovery-migrate:
    build:
      <<: *discovery-build
      target: worker
    env_file:
      - ${DISCOVERY_ENV_FILE:-./env/docker.discovery.env.example}
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - sleeklybuilt

  discovery-web:
    build:
      <<: *discovery-build
      target: web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file:
      - ${DISCOVERY_ENV_FILE:-./env/docker.discovery.env.example}
    volumes:
      - discovery_storage:/app/storage/uploads
    ports:
      - '${DISCOVERY_HTTP_PORT:-3000}:3000'
    depends_on:
      discovery-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sleeklybuilt

  discovery-worker:
    build:
      <<: *discovery-build
      target: worker
    restart: unless-stopped
    env_file:
      - ${DISCOVERY_ENV_FILE:-./env/docker.discovery.env.example}
    volumes:
      - discovery_storage:/app/storage/uploads
    depends_on:
      discovery-migrate:
        condition: service_completed_successfully
    networks:
      - sleeklybuilt

  nginx:
    volumes:
      - ./nginx/conf.d/discovery.conf:/etc/nginx/conf.d/discovery.conf:ro
    depends_on:
      discovery-web:
        condition: service_started
      php-fpm:
        condition: service_started

volumes:
  postgres_data:
  discovery_storage:

networks:
  sleeklybuilt:
    name: ${COMPOSE_NETWORK_NAME:-infra_ulnovatech}
    driver: bridge
