# SleeklyBuilt — local Docker stack (Chunk 3)
# nginx + php-fpm + MySQL serving public_html

name: infra

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sleeklybuilt}
      MYSQL_USER: ${MYSQL_USER:-sleeklybuilt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sleeklybuilt_dev_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - sleeklybuilt

  php-fpm:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Writable mount: .env files are bind-mounted under public_html paths
      - ${PUBLIC_HTML_PATH:-../public_html}:/var/www/public_html
      - ${SLEEKLYBUILT_ENV_FILE:-./env/docker.sleeklybuilt.env.example}:/var/www/public_html/php/.env:ro
      - ${SLEEKLYBUILT_ENV_FILE:-./env/docker.sleeklybuilt.env.example}:/var/www/public_html/sleekly-dash/backend/.env:ro
      - template_import_data:/var/lib/sleeklybuilt/template-imports
      - template_import_logs:/var/log/sleeklybuilt/template-import
      - template_profile_data:/var/lib/sleeklybuilt/template-profiles
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sleeklybuilt

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ${PUBLIC_HTML_PATH:-../public_html}:/var/www/public_html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d/sleeklybuilt.conf:/etc/nginx/conf.d/sleeklybuilt.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      - sleeklybuilt

volumes:
  mysql_data:
  template_import_data:
  template_import_logs:
  template_profile_data:

networks:
  sleeklybuilt:
    # Preserve the live GCE network name so cutover does not try to
    # delete infra_ulnovatech while hub (and other) containers still use it.
    name: ${COMPOSE_NETWORK_NAME:-infra_ulnovatech}
    driver: bridge
