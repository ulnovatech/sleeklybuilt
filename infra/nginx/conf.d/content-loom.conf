# Content Loom control panel — host systemd on :8090
# Public: https://loom.sleeklybuilt.pro (Cloudflare Flexible → origin :80)
# host.docker.internal comes from compose extra_hosts (host-gateway) → /etc/hosts.
# Do NOT use variable proxy_pass + Docker DNS (127.0.0.11) — that ignores /etc/hosts.

upstream content_loom {
    server host.docker.internal:8090;
}

server {
    listen 80;
    server_name loom.sleeklybuilt.pro;

    client_max_body_size 32m;

    location / {
        proxy_pass http://content_loom;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
