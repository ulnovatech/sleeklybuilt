# SleeklyBuilt main site — ports rules from repo root .htaccess and sub-app htaccess files.
# document_root: /var/www/public_html (mounted from build output)

# Production: https://sleeklybuilt.pro (Cloudflare Flexible → origin :80)
# Also accept bare IP / legacy nip.io Host during cutover.
# default_server so bare-IP requests hit the hub (not Discovery).
server {
    listen 80 default_server;
    server_name sleeklybuilt.pro www.sleeklybuilt.pro hub.172.238.122.106.nip.io 172.238.122.106 localhost;

    root /var/www/public_html;
    index index.html;

    # Plain health check for load balancers / smoke tests
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Docroot hardening (Chunk 1) ---
    # Dotfiles (.env, .git, .htaccess contents must not be fetched as static)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Explicit env stubs / secret filenames even if not dot-prefixed
    location ~* /\.env$ {
        deny all;
        return 404;
    }
    location ~* /(service-account\.json|composer\.(json|lock)|package(-lock)?\.json)$ {
        deny all;
        return 404;
    }

    # Legacy CRM tree must never be HTTP-reachable
    location ^~ /ulndash/ {
        deny all;
        return 404;
    }

    # Legacy HTML → React routes (.htaccess L3-L5)
    location = /about.html {
        return 301 /about;
    }
    location = /prices.html {
        return 301 /prices;
    }

    # CRM API → sleekly-dash/backend/api.php (.htaccess L12-L13 + backend/.htaccess)
    location /api/ {
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/sleekly-dash/backend/api.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Public PHP form handlers — PHP only; deny static leakage under /php/
    location ^~ /php/ {
        location ~ \.php$ {
            allow all;
            include /etc/nginx/snippets/fastcgi-php.conf;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }
        deny all;
        return 404;
    }

    # Legacy forms/*.php (optional path)
    location ^~ /forms/ {
        location ~ \.php$ {
            allow all;
            include /etc/nginx/snippets/fastcgi-php.conf;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }
        deny all;
        return 404;
    }

    # Portfolio JSON API (/portfolio/api/*.php)
    location ^~ /portfolio/api/ {
        location ~ \.php$ {
            allow all;
            include /etc/nginx/snippets/fastcgi-php.conf;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }
        deny all;
        return 404;
    }

    # Static asset trees (explicit — skip SPA fallback)
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Portfolio template static files
    location ^~ /portfolio/portfolio/ {
        try_files $uri $uri/ =404;
    }

    # Blog SPA — scripts/htaccess/blog.htaccess
    location ^~ /blog/ {
        try_files $uri $uri/ /blog/index.html;
    }

    # CRM dashboard SPA — scripts/htaccess/dash.htaccess
    location ^~ /dash/ {
        try_files $uri $uri/ /dash/index.html;
    }

    # Portfolio picker SPA — scripts/htaccess/portfolio-app.htaccess
    location ^~ /portfolio-app/ {
        try_files $uri $uri/ /portfolio-app/index.html;
    }

    # Operator Admin APK distribution (kate-style: landing + latest.json + APK)
    # Exact files only for assets — do not fall back to index.html (that broke APK downloads).
    # CORS: Capacitor WebView (https://localhost) must read latest.json via fetch.
    location ^~ /admin-app/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        types {
            text/html html htm;
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri $uri/ =404;
    }

    location = /admin-app/ {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /admin-app/index.html =404;
    }

    location = /admin-app {
        return 301 /admin-app/;
    }

    # Block direct HTTP to attendant contract (INTERNAL/SYSTEM markdown must not be public)
    location ^~ /attendant/ {
        deny all;
        return 404;
    }

    # Block direct access to backend source outside /api
    location ^~ /sleekly-dash/backend/ {
        deny all;
        return 404;
    }

    # Marketing SPA fallback (.htaccess L15-L25)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
