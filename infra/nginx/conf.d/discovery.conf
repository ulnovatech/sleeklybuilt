# Discovery Intelligence (Demand Capture) — Next.js on discovery-web container
# Use variable upstream so nginx can boot before discovery-web DNS exists.

server {
    listen 80;
    # Temporary public access: http://discovery.34.66.94.12.nip.io/
    server_name discovery.34.66.94.12.nip.io;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $discovery_upstream discovery-web:3000;

    location / {
        proxy_pass http://$discovery_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
