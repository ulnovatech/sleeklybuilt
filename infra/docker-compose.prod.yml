# Production overrides — use with:
# docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.prod.yml up -d --build

services:
  mysql:
    restart: always

  php-fpm:
    restart: always
    volumes:
      # Override replaces base volumes — keep public_html + env mounts explicit.
      - /opt/sleeklybuilt/public_html:/var/www/public_html
      - /opt/sleeklybuilt/env/docker.sleeklybuilt.env:/var/www/public_html/php/.env:ro
      - /opt/sleeklybuilt/env/docker.sleeklybuilt.env:/var/www/public_html/sleekly-dash/backend/.env:ro
      - /opt/sleeklybuilt/data/template-imports:/var/lib/sleeklybuilt/template-imports
      - /opt/sleeklybuilt/logs/template-import:/var/log/sleeklybuilt/template-import
      - /opt/sleeklybuilt/data/template-profiles:/var/lib/sleeklybuilt/template-profiles

  nginx:
    restart: always
    ports:
      - '80:80'
    volumes:
      - /opt/sleeklybuilt/public_html:/var/www/public_html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d/sleeklybuilt.conf:/etc/nginx/conf.d/sleeklybuilt.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/discovery.conf:/etc/nginx/conf.d/discovery.conf:ro

  postgres:
    restart: always

  discovery-web:
    restart: always

  discovery-worker:
    restart: always
