# Production overrides — use with:
# docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.prod.yml up -d --build

services:
  mysql:
    restart: always

  php-fpm:
    restart: always
    volumes:
      - /opt/ulnovatech/data/template-imports:/var/lib/ulnovatech/template-imports
      - /opt/ulnovatech/logs/template-import:/var/log/ulnovatech/template-import
      - /opt/ulnovatech/data/template-profiles:/var/lib/ulnovatech/template-profiles

  nginx:
    restart: always
    ports:
      - '80:80'

  postgres:
    restart: always

  discovery-web:
    restart: always

  discovery-worker:
    restart: always
