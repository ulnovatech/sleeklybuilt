name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-design-os:
    name: Validate Design OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Design OS corpus and .cursor rules
        run: npm run validate:design-os

  build-ulnovatech:
    name: Build public_html (Linux)
    runs-on: ubuntu-latest
    needs: [validate-design-os]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP + Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y composer php-cli php-mysql php-mbstring php-xml php-zip

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build:linux

      - name: Verify public_html output
        run: |
          test -f public_html/index.html
          test -d public_html/dash
          test -f public_html/sleekly-dash/backend/api.php

  build-discovery:
    name: Build Discovery Intelligence
    runs-on: ubuntu-latest
    needs: [validate-design-os]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agency_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/agency_platform
      ALLOW_DEV_AUTH: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Discovery source (C0)
        id: discovery
        run: |
          chmod +x scripts/resolve-discovery-src.sh
          SRC="$(scripts/resolve-discovery-src.sh)"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Resolved Discovery source: $SRC"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.discovery.outputs.src }}/pnpm-lock.yaml

      - name: Install, migrate, typecheck, build
        working-directory: ${{ steps.discovery.outputs.src }}
        run: |
          pnpm install --frozen-lockfile
          pnpm db:migrate
          pnpm typecheck
          pnpm build

  lint-discovery:
    name: Lint Discovery (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Discovery source (C0)
        id: discovery
        run: |
          chmod +x scripts/resolve-discovery-src.sh
          SRC="$(scripts/resolve-discovery-src.sh)"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.discovery.outputs.src }}/pnpm-lock.yaml

      - working-directory: ${{ steps.discovery.outputs.src }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

  attendant-layer-a:
    name: Attendant Layer A + widget checks
    runs-on: ubuntu-latest
    needs: [validate-design-os]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ulnovatech
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ''
      DB_NAME: ulnovatech
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring php-xml php-curl

      - name: Apply attendant migration
        run: php php/attendant/scripts/apply_attendant_migration.php

      - name: Layer A regression
        run: php php/attendant/tests/run.php

      - name: Hub smoke (3H gate)
        run: php php/attendant/scripts/smoke_hub.php

      - name: Widget static checks
        run: node marketing/scripts/check-attendant-widget.mjs

      - name: Marketing production build
        working-directory: marketing
        run: |
          npm ci
          npm run build
