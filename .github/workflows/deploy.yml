name: Deploy to Linode

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linode-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Linode
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP + Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y composer php-cli php-mysql php-mbstring php-xml php-zip

      - name: Performante auth + SEO smoke
        env:
          SITE_URL: https://sleeklybuilt.pro
        run: |
          npm run test:performante:auth
          npm run seo:generate
          npm run seo:smoke -- --dir marketing/public

      - name: Build public_html
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_ADMIN_USER_ID: ${{ secrets.VITE_CLERK_ADMIN_USER_ID }}
        run: |
          npm ci
          npm run build:linux

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve Discovery source (C0)
        id: discovery
        run: |
          chmod +x scripts/resolve-discovery-src.sh
          SRC="$(scripts/resolve-discovery-src.sh)"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Resolved Discovery source: $SRC"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.discovery.outputs.src }}/pnpm-lock.yaml

      - name: Verify Discovery Docker build context
        working-directory: ${{ steps.discovery.outputs.src }}
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_PUBLIC_APP_URL: https://discovery.sleeklybuilt.pro
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure SSH
        env:
          LINODE_SSH_HOST: ${{ secrets.LINODE_SSH_HOST }}
          LINODE_SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          LINODE_SSH_USER: ${{ secrets.LINODE_SSH_USER }}
          GCE_SSH_HOST: ${{ secrets.GCE_SSH_HOST }}
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          GCE_SSH_USER: ${{ secrets.GCE_SSH_USER }}
        run: |
          HOST="${LINODE_SSH_HOST:-$GCE_SSH_HOST}"
          KEY="${LINODE_SSH_PRIVATE_KEY:-$GCE_SSH_PRIVATE_KEY}"
          USER="${LINODE_SSH_USER:-${GCE_SSH_USER:-deploy}}"
          test -n "$HOST"
          test -n "$KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_SSH_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_USER=$USER" >> "$GITHUB_ENV"

      - name: Reset public_html ownership for rsync
        run: |
          DEPLOY_HOST="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # php-fpm (www-data) can own bind-mounted files after runtime writes;
          # rsync then cannot update attendant/ or delete leftover ulndash/.
          ssh $SSH_OPTS "$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          UID_N=$(id -u)
          GID_N=$(id -g)
          CID=$(docker ps -qf "name=php-fpm" | head -1)
          if [ -n "$CID" ]; then
            docker exec -u 0 "$CID" chown -R "${UID_N}:${GID_N}" /var/www/public_html
            docker exec -u 0 "$CID" rm -rf /var/www/public_html/ulndash
          fi
          chown -R "${UID_N}:${GID_N}" /opt/sleeklybuilt/public_html 2>/dev/null
          rm -rf /opt/sleeklybuilt/public_html/ulndash 2>/dev/null
          true
          REMOTE

      - name: Rsync artifacts to Linode
        run: |
          DEPLOY_HOST="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$DEPLOY_HOST" 'mkdir -p /opt/sleeklybuilt/public_html /opt/sleeklybuilt/repo'

          rsync -az --delete -e "ssh $SSH_OPTS" \
            --exclude '.env' \
            --exclude 'php/.env' \
            --exclude 'sleekly-dash/backend/.env' \
            --exclude 'portfolio/portfolio/' \
            public_html/ "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/"

          # Guarantee runtime contract (company + expertise) even if a prior
          # permission error left public_html/attendant incomplete.
          ssh $SSH_OPTS "$DEPLOY_HOST" 'mkdir -p /opt/sleeklybuilt/public_html/attendant'
          rsync -az --delete -e "ssh $SSH_OPTS" \
            attendant/schemas attendant/prompts attendant/rules attendant/skills \
            attendant/company attendant/expertise \
            "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/attendant/"
          ssh $SSH_OPTS "$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e
          chmod -R a+rX /opt/sleeklybuilt/public_html/attendant /opt/sleeklybuilt/public_html/php/attendant
          test -f /opt/sleeklybuilt/public_html/attendant/company/manifest.json
          test -d /opt/sleeklybuilt/public_html/attendant/expertise/cards
          ls -1 /opt/sleeklybuilt/public_html/attendant
          REMOTE

          # Runtime imports live in this directory. Update tracked templates
          # without deleting imported folders or replacing runtime metadata.
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'mkdir -p /opt/sleeklybuilt/public_html/portfolio/portfolio'
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude 'catalog.json' \
            public_html/portfolio/portfolio/ \
            "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/portfolio/portfolio/"
          rsync -az -e "ssh $SSH_OPTS" \
            public_html/portfolio/portfolio/catalog.json \
            "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/sleekly-dash/backend/.catalog.build.json"

          rsync -az -e "ssh $SSH_OPTS" \
            --exclude 'env/*.env' \
            --exclude 'env/docker.sleeklybuilt.env' \
            --exclude 'env/docker.discovery.env' \
            --exclude '.env' \
            infra/ "${DEPLOY_HOST}:/opt/sleeklybuilt/repo/infra/"

          # C0: rsync resolved Lead Discover source (sibling or ./discovery junction)
          DISCOVERY_SRC="$(./scripts/resolve-discovery-src.sh)"
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude node_modules \
            --exclude .next \
            --exclude .turbo \
            --exclude .env \
            "${DISCOVERY_SRC}/" "${DEPLOY_HOST}:/opt/sleeklybuilt/repo/discovery/"

      - name: Deploy Docker stack and run migrations
        run: |
          DEPLOY_HOST="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'chmod +x /opt/sleeklybuilt/repo/infra/scripts/prod-deploy-stack.sh && bash /opt/sleeklybuilt/repo/infra/scripts/prod-deploy-stack.sh'

      - name: Smoke test (HTTP on VM)
        run: |
          DEPLOY_HOST="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'curl -sf -H "Host: sleeklybuilt.pro" http://127.0.0.1/health && SMOKE_HOST=sleeklybuilt.pro bash /opt/sleeklybuilt/repo/infra/scripts/smoke-sleeklybuilt.sh http://127.0.0.1'
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'curl -sf -H "Host: discovery.sleeklybuilt.pro" http://127.0.0.1/api/health'
