name: Deploy to GCE

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gce-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GCE VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP + Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y composer php-cli php-mysql php-mbstring php-xml php-zip

      - name: Build public_html
        run: |
          npm ci
          npm run build:linux

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve Discovery source (C0)
        id: discovery
        run: |
          chmod +x scripts/resolve-discovery-src.sh
          SRC="$(scripts/resolve-discovery-src.sh)"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Resolved Discovery source: $SRC"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.discovery.outputs.src }}/pnpm-lock.yaml

      - name: Verify Discovery Docker build context
        working-directory: ${{ steps.discovery.outputs.src }}
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_PUBLIC_APP_URL: http://discovery.34.66.94.12.nip.io
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure SSH
        env:
          GCE_SSH_HOST: ${{ secrets.GCE_SSH_HOST }}
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GCE_SSH_HOST"
          test -n "$GCE_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$GCE_SSH_PRIVATE_KEY" > ~/.ssh/gce_deploy_key
          chmod 600 ~/.ssh/gce_deploy_key
          ssh-keyscan -H "$GCE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync artifacts to GCE VM
        env:
          GCE_SSH_HOST: ${{ secrets.GCE_SSH_HOST }}
          GCE_SSH_USER: ${{ secrets.GCE_SSH_USER }}
        run: |
          DEPLOY_USER="${GCE_SSH_USER:-deploy}"
          DEPLOY_HOST="${DEPLOY_USER}@${GCE_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/gce_deploy_key -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$DEPLOY_HOST" 'mkdir -p /opt/sleeklybuilt/public_html /opt/sleeklybuilt/repo'

          rsync -az --delete -e "ssh $SSH_OPTS" \
            --exclude '.env' \
            --exclude 'php/.env' \
            --exclude 'sleekly-dash/backend/.env' \
            --exclude 'portfolio/portfolio/' \
            public_html/ "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/"

          # Runtime imports live in this directory. Update tracked templates
          # without deleting imported folders or replacing runtime metadata.
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'mkdir -p /opt/sleeklybuilt/public_html/portfolio/portfolio'
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude 'catalog.json' \
            public_html/portfolio/portfolio/ \
            "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/portfolio/portfolio/"
          rsync -az -e "ssh $SSH_OPTS" \
            public_html/portfolio/portfolio/catalog.json \
            "${DEPLOY_HOST}:/opt/sleeklybuilt/public_html/sleekly-dash/backend/.catalog.build.json"

          rsync -az -e "ssh $SSH_OPTS" \
            --exclude 'env/*.env' \
            --exclude 'env/docker.sleeklybuilt.env' \
            --exclude 'env/docker.discovery.env' \
            --exclude '.env' \
            infra/ "${DEPLOY_HOST}:/opt/sleeklybuilt/repo/infra/"

          # C0: rsync resolved Lead Discover source (sibling or ./discovery junction)
          DISCOVERY_SRC="$(./scripts/resolve-discovery-src.sh)"
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude node_modules \
            --exclude .next \
            --exclude .turbo \
            --exclude .env \
            "${DISCOVERY_SRC}/" "${DEPLOY_HOST}:/opt/sleeklybuilt/repo/discovery/"

      - name: Deploy Docker stack and run migrations
        env:
          GCE_SSH_HOST: ${{ secrets.GCE_SSH_HOST }}
          GCE_SSH_USER: ${{ secrets.GCE_SSH_USER }}
        run: |
          DEPLOY_USER="${GCE_SSH_USER:-deploy}"
          DEPLOY_HOST="${DEPLOY_USER}@${GCE_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/gce_deploy_key -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/sleeklybuilt/repo

          if [[ -f /opt/sleeklybuilt/secrets/service-account.json ]]; then
            install -m 600 -D /opt/sleeklybuilt/secrets/service-account.json \
              /opt/sleeklybuilt/public_html/sleekly-dash/backend/service-account.json
          fi

          export PUBLIC_HTML_PATH=/opt/sleeklybuilt/public_html
          export SLEEKLYBUILT_ENV_FILE=/opt/sleeklybuilt/env/docker.sleeklybuilt.env
          export DISCOVERY_ENV_FILE=/opt/sleeklybuilt/env/docker.discovery.env
          # C0: on the VM, compose builds the rsynced tree (not the local sibling path)
          export DISCOVERY_BUILD_CONTEXT=../discovery

          if [[ ! -f "$SLEEKLYBUILT_ENV_FILE" ]]; then
            echo "Missing $SLEEKLYBUILT_ENV_FILE — create from infra/env/docker.sleeklybuilt.env.example on the VM" >&2
            exit 1
          fi
          if [[ ! -f "$DISCOVERY_ENV_FILE" ]]; then
            echo "Missing $DISCOVERY_ENV_FILE — create from infra/env/docker.discovery.env.example on the VM" >&2
            exit 1
          fi

          # php-fpm runs as www-data (uid 33); mode 600 owned by deploy is unreadable → DB connection failed
          # Some env files may be root-owned after manual key injection — don't abort deploy.
          chmod 644 "$SLEEKLYBUILT_ENV_FILE" 2>/dev/null || true
          chmod 644 "$DISCOVERY_ENV_FILE" 2>/dev/null || true
          # Ensure files remain readable even when chmod is denied.
          test -r "$SLEEKLYBUILT_ENV_FILE"
          test -r "$DISCOVERY_ENV_FILE"
          # Bind-mount targets must be files (not directories) before recreate
          mkdir -p /opt/sleeklybuilt/public_html/php /opt/sleeklybuilt/public_html/sleekly-dash/backend
          : > /opt/sleeklybuilt/public_html/php/.env
          : > /opt/sleeklybuilt/public_html/sleekly-dash/backend/.env

          # Compose reads MYSQL_*/POSTGRES_* from infra/.env (dir of first -f file)
          if [[ -f /opt/sleeklybuilt/repo/.env && ! -f /opt/sleeklybuilt/repo/infra/.env ]]; then
            install -m 600 /opt/sleeklybuilt/repo/.env /opt/sleeklybuilt/repo/infra/.env
          fi

          # Bake NEXT_PUBLIC_* into discovery-web image (compose build args, not only runtime env_file)
          set -a
          # shellcheck disable=SC1090
          source "$DISCOVERY_ENV_FILE"
          set +a

          # Persistent private staging and logs survive container replacement.
          mkdir -p /opt/sleeklybuilt/data/template-imports \
            /opt/sleeklybuilt/data/template-profiles \
            /opt/sleeklybuilt/logs/template-import
          CRON_MARKER='# sleeklybuilt-template-import-maintenance'
          CRON_JOB="17 3 * * * /bin/bash /opt/sleeklybuilt/repo/infra/scripts/run-template-import-maintenance.sh 2>&1 | /usr/bin/logger -t sleeklybuilt-template-import-maintenance ${CRON_MARKER}"
          {
            crontab -l 2>/dev/null | grep -vF "$CRON_MARKER" || true
            printf '%s\n' "$CRON_JOB"
          } | crontab -

          # Keep Compose project aligned with the live GCE stack (infra_*).
          export COMPOSE_PROJECT_NAME=infra

          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.prod.yml up -d --build

          # Host deploy user owns the library; php-fpm (gid 33) needs publish
          # access. setgid keeps imported files in the shared group.
          docker compose -f infra/docker-compose.full.yml exec -T php-fpm \
            sh -lc 'chgrp 33 /var/www/public_html/portfolio/portfolio && chmod 2775 /var/www/public_html/portfolio/portfolio'

          docker compose -f infra/docker-compose.full.yml run --rm discovery-migrate

          docker compose -f infra/docker-compose.full.yml exec -T php-fpm \
            php /var/www/public_html/sleekly-dash/backend/scripts/apply_admin_mobile_migrations.php

          docker compose -f infra/docker-compose.full.yml exec -T php-fpm \
            php /var/www/public_html/sleekly-dash/backend/scripts/apply_dash_users_migration.php

          docker compose -f infra/docker-compose.full.yml exec -T php-fpm \
            php /var/www/public_html/sleekly-dash/backend/scripts/apply_template_import_migrations.php

          docker compose -f infra/docker-compose.full.yml exec -T php-fpm \
            php /var/www/public_html/sleekly-dash/backend/scripts/merge_template_catalog.php

          # nginx caches upstream IPs at start — refresh after migrations and discovery-web are up
          sleep 3
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.prod.yml up -d discovery-web
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.prod.yml up -d --force-recreate --no-deps nginx

          docker compose -f infra/docker-compose.full.yml ps
          REMOTE

      - name: Smoke test (HTTP on VM)
        env:
          GCE_SSH_HOST: ${{ secrets.GCE_SSH_HOST }}
          GCE_SSH_USER: ${{ secrets.GCE_SSH_USER }}
        run: |
          DEPLOY_USER="${GCE_SSH_USER:-deploy}"
          DEPLOY_HOST="${DEPLOY_USER}@${GCE_SSH_HOST}"
          SSH_OPTS="-i ~/.ssh/gce_deploy_key -o StrictHostKeyChecking=accept-new"
          # Hub smoke with temporary nip.io Host (see docs/ACCESS.md).
          ssh $SSH_OPTS "$DEPLOY_HOST" \
            'curl -sf -H "Host: hub.34.66.94.12.nip.io" http://127.0.0.1/health && SMOKE_HOST=hub.34.66.94.12.nip.io bash /opt/sleeklybuilt/repo/infra/scripts/smoke-sleeklybuilt.sh http://127.0.0.1'
